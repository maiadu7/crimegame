<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jogo de Crime Secreto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    body { font-family: Arial; background: #111; color: #eee; text-align: center; padding: 20px; }
    button {
        padding: 15px 30px;
        background: #c00;
        border: none;
        font-size: 20px;
        color: #fff;
        cursor: pointer;
        border-radius: 8px;
        margin: 10px;
    }
    button:hover { background: #e00; }
    .qr-box { margin-top: 40px; }
</style>
</head>

<body>

<h1>Jogo de Crime — Sorteio Oculto</h1>
<p>O QR Code conterá um código secreto curto.</p>

<button onclick="gerarSorteio()">Gerar Novo Caso</button>

<div id="listaQR"></div>

<script>
const personagens = [
    "Tokio", "Jadis", "Malévola", "Negan", 
    "Tommy", "Dexter", "EdGein"
];

const armas = ["F1", "F2", "C1", "V1", "M1", "B1"];
const locais = ["AR", "FL", "PO", "CA", "GA", "ES"];
const motivos = ["VNG", "CIU", "PKT", "TRM", "DIN", "CHG"];
const pistasVerdadeiras = ["PV1", "PV2", "PV3", "PV4", "PV5"];
const pistasFalsas = ["PF1", "PF2", "PF3", "PF4", "PF5"];

function gerarSorteio() {
    let copia = [...personagens];

    let assassino = copia.splice(Math.floor(Math.random() * copia.length), 1)[0];
    let vitima = copia[Math.floor(Math.random() * copia.length)];

    let arma = armas[Math.floor(Math.random() * armas.length)];
    let local = locais[Math.floor(Math.random() * locais.length)];
    let motivo = motivos[Math.floor(Math.random() * motivos.length)];

    let verdade = [...pistasVerdadeiras].sort(() => Math.random() - 0.5).slice(0, 3);
    let falsas = [...pistasFalsas].sort(() => Math.random() - 0.5).slice(0, 2);

    // CÓDIGO CURTO (forma compactada)
    let codigoSecreto =
        `A=${assassino};V=${vitima};L=${local};AR=${arma};M=${motivo};PV=${verdade.join(",")};PF=${falsas.join(",")}`;

    // Cria o QR
    let box = document.createElement("div");
    box.className = "qr-box";

    let divQR = document.createElement("div");
    box.appendChild(divQR);

    document.getElementById("listaQR").appendChild(box);

    new QRCode(divQR, {
        text: codigoSecreto,
        width: 256,
        height: 256
    });
}
</script>
</body>
</html>
